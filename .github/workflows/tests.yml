# Hermetic tests for the governance core: pack hashing and the collapse equation.
# No database, model or network is needed; the only dependency is pytest.
name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest
